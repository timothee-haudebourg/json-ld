[package]
name = "json-ld"
authors = ["Timothée Haudebourg <timothee@haudebourg.net>"]
description = "JSON-LD implementation"
categories = ["web-programming", "database", "data-structures"]
keywords = ["json-ld", "json", "semantic-web", "linked-data", "rdf"]
repository = "https://github.com/timothee-haudebourg/json-ld"
documentation = "https://docs.rs/json-ld"
readme = "README.md"
license = "MIT/Apache-2.0"
edition = "2024"
rust-version = "1.96.0"
version = "0.19.1"


[features]
default = ["algorithms", "reqwest"]

# JSON-LD algorithms implementations.
algorithms = ["serde"]

# Serialization/deserialization with `serde`.
serde = ["dep:serde", "indexmap/serde", "rdf-syntax/serde"]

# Loader implementation based on `reqwest`.
reqwest = ["dep:reqwest", "dep:reqwest-middleware"]

# Async file-system loader backed by Tokio.
tokio = ["dep:tokio"]

# Enables the `locspan/miette` feature.
miette = ["dep:miette", "json-syntax/miette"]

# Dependencies needed to build the `json-ld` CLI binary.
cli = ["dep:clap", "dep:miette", "dep:nquads-syntax", "miette", "miette/fancy", "tokio/macros", "tokio/rt-multi-thread"]

[[bin]]
name = "json-ld"
path = "src/bin/cli.rs"
required-features = ["cli"]

[dependencies]
# json-syntax = "0.12"
json-syntax = { path = "/home/work/Documents/Community/JSON/syntax", features = [
	"serde",
	"canonicalize",
] }
langtag = "0.4"
rdf-syntax.path = "/home/work/Documents/Community/RDF/rdf-syntax"
educe = "0.4.23"
futures = "0.3"
mown = "0.2.2"
hashbrown = "0.13.1"
smallvec = "1.10"
log = "0.4.17"
thiserror = "1.0.38"
indexmap = "2.10"
mime = "0.3"
anyhow = "1.0.98"

serde = { version = "1.0", features = ["derive"], optional = true }

miette = { version = "7", optional = true }

# CLI dependencies (see the `cli` feature).
clap = { version = "4", features = ["derive"], optional = true }
nquads-syntax = { path = "/home/work/Documents/Community/RDF/nquads-syntax", optional = true }

# Serialization/deserialization with `serde`.
# linked-data = "0.1"
linked-data = { path = "/home/work/Documents/Spruce/Core_Tooling/linked-data", features = [
	"indexmap",
	"derive"
] }
xsd-types.path = "/home/work/Documents/Community/RDF/xsd-types"

# Loader implementation based on `reqwest`.
reqwest = { version = "0.12.22", optional = true }
reqwest-middleware = { version = "0.4.2", optional = true }
tokio = { version = "1", features = ["fs", "io-util"], optional = true }

[dev-dependencies]
json-ld-testing = { path = "testing" }
tokio = { version = "*", features = ["macros", "rt", "rt-multi-thread"] }

[package.metadata.docs.rs]
all-features = true

[workspace]
members = ["testing", "testing/core", "testing/derive"]

resolver = "2"